# The default Gemini model to use for summaries.
# This can be overridden by the --model command-line flag.
gemini_model = "gemini-3.1-flash-lite"

# Your Gemini API key.
# If this is empty, the application will check the GEMINI_API_KEY environment variable.
# If neither is set, you will be prompted to enter a key on startup.
gemini_api_key = ""

# Set to false to disable the startup prompt for the API key.
prompt_for_api_key = true

# Path to a custom prompt template file.
# If set, this file will be used for generating AI summaries.
# This can be overridden by the --prompt command-line flag.
custom_prompt_path = ""

# Default language for the AI summary.
# Can be overridden by the --lang command-line flag.
lang = "english"

# Which AI backend to use: "gemini" (default) or "custom".
# "custom" works with any OpenAI-compatible chat-completions API such as
# OpenRouter, the Vercel AI Gateway, a local server, or OpenAI itself.
# Can be overridden by the --provider command-line flag.
provider = "gemini"

# Base URL of the custom OpenAI-compatible endpoint (only used when provider = "custom").
# Examples:
#   https://openrouter.ai/api/v1
#   https://api.openai.com/v1
# Can be overridden by the --base-url command-line flag.
custom_base_url = "https://openrouter.ai/api/v1"

# Model name for the custom provider, e.g. "openai/gpt-4o-mini"
# or "anthropic/claude-3.5-sonnet" on OpenRouter.
# Can be overridden by the --model command-line flag.
custom_model = "google/gemini-3.1-flash-lite"

# API key for the custom provider.
# If empty, the CUSTOM_API_KEY environment variable is used instead.
# The setup wizard mirrors the active provider's key here for the runtime path.
custom_api_key = ""

# Per-provider key stores filled in by the setup wizard. Keeping a key per
# provider lets the wizard recall the right one when you switch providers.
openrouter_api_key = ""
vercel_api_key = ""
openai_api_key = ""

# How many of the most recent AI generations to keep in the history store
# (~/.config/whid/overviews.json). When a new summary is saved, anything older
# than this is pruned. Applies to both the TUI and the direct --generate mode.
recent_generations = 20