[package]
name = "whathaveidone"
version = "0.6.1"
edition = "2024"
authors = ["Florenz Heldermann"]
description = "CLI tool for daily standups with Git and Ratatui"
license = "MIT"
repository = "https://github.com/heroheman/whathaveidone"
readme = "readme.md"

[[bin]]
name = "whathaveidone"
path = "src/main.rs"

[[bin]]
name = "whid"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30.0", features = ["all-widgets"] }
crossterm = "0.29"
chrono = "0.4"
anyhow = "1.0"
tokio = { version = "1.32.0", features = ["rt-multi-thread", "time", "macros"] }
gemini-rs = "=2.0.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
serde_json = "1.0"
arboard = "3.6"
regex = "1.11.1"
once_cell = "1.21.3"
config = { version = "0.15.23", features = ["toml"] }
serde = { version = "1.0.219", features = ["derive"] }
dirs = "6.0"
toml = "0.8"
clap = { version = "4.5.40", features = ["derive"] }
